name: Validate CodeRabbit config

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba # reviewed upstream commit
        with:
          python-version: "3.13"

      - name: Install validator
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-cache-dir
          --require-hashes
          --only-binary=:all:
          -r .github/requirements/coderabbit-validator.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate central configuration
        run: python scripts/validate_coderabbit.py .coderabbit.yaml
